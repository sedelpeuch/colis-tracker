<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d0f">
  <title>Colis Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/logo-32.png">
  <link rel="apple-touch-icon" href="/static/logo-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=8">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="topbar__brand" href="/">
        <img class="topbar__logo" src="/static/logo.svg" alt="">
        <div>
          <h1 class="topbar__name">Colis <span class="topbar__name-accent">Tracker</span></h1>
          <p class="topbar__subtitle overline">Suivi Colissimo et Chronopost</p>
        </div>
      </a>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
