{% extends "base.html" %}
{% block content %}
<form class="add-form field" method="post" action="/packages">
  <input class="mono" type="text" name="tracking_code" placeholder="Numéro de suivi (ex. 6A12345678901)" aria-label="Numéro de suivi" required>
  <input type="text" name="label" placeholder="Nom du colis (optionnel)" aria-label="Nom du colis">
  <button class="button" type="submit">Suivre</button>
</form>

<div id="packages-list" hx-get="/packages/table" hx-trigger="every 30s" hx-swap="innerHTML">
  {% include "partials/table.html" %}
</div>
{% endblock %}
